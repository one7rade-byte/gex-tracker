name: GEX Daily Tracker
on:
  schedule:
    # ~2:00 PM ET every weekday, added 2026-10-21 as a second daily pull
    # alongside the existing 6pm ET run (still triggered externally via
    # cron-job.org's repository_dispatch below). Two crons because GitHub
    # Actions schedules are UTC-only and don't shift for US daylight saving:
    #   18:07 UTC = 2:07 PM EDT (Mar-Nov), 19:07 UTC = 2:07 PM EST (Nov-Mar).
    # Deliberately NOT minute 0: GitHub's own docs warn that top-of-the-hour
    # crons are the most congested slot and get delayed or silently dropped
    # for that cycle - confirmed happened here, the first run (minute 0,
    # 2026-10-22) never fired at all, not even as a failed run in history.
    # The "Check it's actually 2pm ET" step below makes sure only the one
    # that's currently correct actually runs the pipeline - the other is a
    # fast no-op, so this never double-runs or double-posts to Telegram.
    - cron: '7 18 * * 1-5'
    - cron: '7 19 * * 1-5'
  repository_dispatch:
    types: [run-gex-tracker]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check it's actually 2pm ET (only matters for the schedule trigger)
        id: time_check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(TZ='America/New_York' date +%H)
            if [ "$HOUR" != "14" ]; then
              echo "It's $HOUR:00 ET right now, not 14:00 - this is the other DST-offset cron firing. Skipping the rest of this run."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.time_check.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.time_check.outputs.proceed == 'true'
        run: pip install requests beautifulsoup4

      - name: Run GEX tracker
        if: steps.time_check.outputs.proceed == 'true'
        env:
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python gex_tracker.py

      - name: Run Regime Analyzer
        if: steps.time_check.outputs.proceed == 'true'
        run: python regime_analyzer.py

      - name: Save CSVs to repository
        if: steps.time_check.outputs.proceed == 'true'
        run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add gex_log.csv regime_log.csv
          git diff --staged --quiet || git commit -m "Daily update $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && break
            echo "Push attempt $i failed, retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Wait for GitHub Pages to update
        if: steps.time_check.outputs.proceed == 'true'
        run: sleep 60

      - name: Send Telegram summary
        if: steps.time_check.outputs.proceed == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py
