name: GEX Daily Tracker

on:
  schedule:
    - cron: '0 23 * * 1-5'  # 6pm EST (11pm UTC) Monday-Friday
  workflow_dispatch:  # allows manual run anytime

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run GEX tracker
        env:
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python gex_tracker.py

      - name: Save CSV to repository
        run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add gex_log.csv
          git diff --staged --quiet || git commit -m "GEX log update $(date +'%Y-%m-%d')"
          git push
