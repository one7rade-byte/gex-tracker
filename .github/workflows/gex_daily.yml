name: GEX Daily Tracker
on:
  repository_dispatch:
    types: [run-gex-tracker]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run GEX tracker
        env:
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python gex_tracker.py
      - name: Save CSV to repository
        run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add gex_log.csv
          git diff --staged --quiet || git commit -m "GEX log update $(date +'%Y-%m-%d')"

          # All daily workflows fire from the same repository_dispatch
          # event simultaneously, so two jobs can race to push -- whoever
          # pushes second gets rejected. Retry with pull --rebase before
          # each attempt so this job replays its commit on top of
          # whatever another workflow already pushed, instead of failing.
          for i in 1 2 3 4 5; do
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && break
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
