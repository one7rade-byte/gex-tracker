name: GEX Key Levels Daily
on:
  schedule:
    # 9 AM ET every weekday. Two crons because GitHub cron is UTC-only:
    #   13:02 UTC = 9:02 AM EDT (Mar-Nov), 14:02 UTC = 9:02 AM EST (Nov-Mar).
    # key_levels.py only acts on the one landing in the 9 AM ET hour and
    # only posts once per day, so the other cron is a no-op.
    - cron: '2 13 * * 1-5'
    - cron: '2 14 * * 1-5'
  repository_dispatch:
    types: [run-key-levels]   # optional: exact 9:00 trigger from cron-job.org
  workflow_dispatch:          # manual Run button — always posts (for testing)
permissions:
  contents: write
jobs:
  key-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python key_levels.py
        env:
          KL_TRIGGER: ${{ github.event_name }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add key_levels.json key_levels_log.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Key levels update $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && \
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && break
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
