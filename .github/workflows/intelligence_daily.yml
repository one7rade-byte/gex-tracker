name: Daily Intelligence Engine
on:
  repository_dispatch:
    types: [run-gex-tracker]
  workflow_dispatch:
jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python intelligence_engine.py
      - run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add intelligence_log.csv intelligence_report.json
          git diff --staged --quiet || git commit -m "Intelligence report $(date +%Y-%m-%d)"

          # All daily workflows fire from the same repository_dispatch
          # event simultaneously, so two jobs finishing their commits
          # close together can race to push -- whichever pushes second
          # gets rejected because the remote has moved. Retry with a
          # pull --rebase before each push attempt so this job picks up
          # whatever the other workflow already pushed and replays its
          # own commit on top, rather than failing outright.
          for i in 1 2 3 4 5; do
            if git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push rejected (attempt $i/5) -- another workflow likely pushed first. Pulling and retrying..."
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main
            sleep $((RANDOM % 10 + 5))
          done
