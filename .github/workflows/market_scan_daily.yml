name: Market Scanner Daily
on:
  schedule:
    # GitHub Actions cron is fixed UTC and does NOT shift for daylight saving,
    # so this drifts between 4:00 PM EDT (most of the year) and 3:00 PM EST
    # (Nov-Mar) — close enough to "after market close" either way; adjust if
    # you want it pinned exactly.
    - cron: '0 20 * * 1-5'   # ~4:00 PM ET Mon-Fri
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python market_scanner.py
      - run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add market_scan_log.csv market_scan_top.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Market scan $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && \
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && break
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
