name: Dip Quality Refresh
# Manual refresh of dip_quality.json (the daily run happens inside
# gex_daily.yml). Useful after re-fitting dip_quality_model.json.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python dip_quality.py
      - name: Commit
        run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add dip_quality.json
          git diff --staged --quiet && exit 0
          git commit -m "Dip quality refresh $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push && break
            sleep $((i*10))
          done
