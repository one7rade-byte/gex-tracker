name: Mag 7 Daily Scanner
on:
  repository_dispatch:
    types: [run-gex-tracker]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mag7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python mag7_tracker.py
      - run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add mag7_log.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Mag 7 daily scan $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && \
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && break
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
