name: Signal Performance Daily
on:
  schedule:
    # Runs once a day after gex_daily.yml/regime_analyzer.py have (usually)
    # already updated gex_log.csv and regime_log.csv for the day. Not
    # timing-sensitive: this script only processes past signals whose
    # forward-return window has already closed using whatever is currently
    # committed, so an early or late run is harmless — it just picks up
    # anything newly resolved the next time it runs.
    - cron: '0 21 * * 1-5'   # ~5:00 PM ET Mon-Fri (drifts an hour with DST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python track_signal_performance.py
      - run: |
          git config user.name "GEX Bot"
          git config user.email "one7rade@gmail.com"
          git add signal_performance_log.csv signal_performance_summary.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Signal performance update $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && \
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/one7rade-byte/gex-tracker.git main && break
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
